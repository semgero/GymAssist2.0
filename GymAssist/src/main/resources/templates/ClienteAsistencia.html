<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GymAssist Cliente</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="/Styles/asistencia.css"/>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="icon" href="/Imagenes/icono.png" type="image/png">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="navbar-left">
      <button class="btn-hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
      <div class="navbar-brand">GymAssist Cliente</div>
    </div>
    <div class="navbar-right">
      <button class="btn-theme" onclick="btnTheme()"><i class="fas fa-moon"></i></button>
      <div class="profile">
        <i class="fas fa-user-circle profile-img" onclick="toggleDropdown(event)"></i>
        <div id="dropdown" class="dropdown">
          <a th:href="@{ClienteCuenta}"><i class="fas fa-user-cog"></i> Cuenta</a>
          <a href="#" onclick="confirmLogout(event)" class="danger">
                        <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                    </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
    <nav>
      <a th:href="@{/Api/Cliente/ClienteHome}" title="home">
        <i class="fas fa-home icon"></i>
        <span class="text">Home</span>
      </a>
      <a th:href="@{/Api/Cliente/Clienteimc}" title="IMC">
        <i class="fas fa-weight icon"></i>
        <span class="text">IMC</span>
      </a>
      <a th:href="@{/Api/Cliente/ClienteRutinas}" title="rutinas">
        <i class="fa-solid fa-dumbbell icon"></i>
        <span class="text">Rutinas</span>
      </a>
      <a th:href="@{/Api/Cliente/ClienteAsistencia}" class="active" title="Asistencia">
        <i class="fas fa-calendar-check icon"></i>
        <span class="text">Asistencia</span>
      </a>
    </nav>
  </aside>

  <!-- Main -->
 <main class="main-content">
    <h1>Asistencia</h1>
    <div th:if="${error}" 
         style="background:#ffdddd; border-left:5px solid #d8000c; padding:12px; margin-top:15px; margin-bottom:15px; border-radius:6px;">
        <p th:text="${error}" style="color:#d8000c; font-weight:bold; margin:0;"></p>
    </div>

    <div class="header-grid">
      <div class="card">
        <h2>Gimnasio al que perteneces:</h2>
        <strong th:text="${nombreGimnasio}"></strong>
      </div>
      <div class="card">
        <h2>Estadísticas</h2>
        <p>Total Inasistencias: <strong th:text="${cliente.inasistencias}"></strong></p>
      </div>
    </div>
    <div class="content-grid">
      <section class="registro card">
        <h2>Registrar Asistencia</h2>
        <form th:action="@{/Api/Cliente/registrar-asistencia}" method="post" class="registro">
          <div>
            <label for="fecha">Fecha</label>
            <input type="text" id="fecha" name="fecha" required th:value="${T(java.time.LocalDate).now()}" readonly/>
          </div>
          <div>
            <label class="form-label">Músculos trabajados</label>
            <ul class="muscle-list">
              <li><input type="checkbox" id="m1" name="musculos" th:value="'Pecho'" /><label for="m1" class="option">Pecho</label></li>
              <li><input type="checkbox" id="m2" name="musculos" th:value="'Espalda'" /><label for="m2" class="option">Espalda</label></li>
              <li><input type="checkbox" id="m3" name="musculos" th:value="'Bíceps'" /><label for="m3" class="option">Bíceps</label></li>
              <li><input type="checkbox" id="m4" name="musculos" th:value="'Tríceps'" /><label for="m4" class="option">Tríceps</label></li>
              <li><input type="checkbox" id="m5" name="musculos" th:value="'Cuádriceps'" /><label for="m5" class="option">Cuádriceps</label></li>
              <li><input type="checkbox" id="m6" name="musculos" th:value="'Femoral'" /><label for="m6" class="option">Femoral</label></li>
              <li><input type="checkbox" id="m7" name="musculos" th:value="'Glúteos'" /><label for="m7" class="option">Glúteos</label></li>
              <li><input type="checkbox" id="m8" name="musculos" th:value="'Hombro'" /><label for="m8" class="option">Hombro</label></li>
            </ul>
          </div>
          <button type="submit">Registrar</button>
        </form>
      </section>
      <section class="card timeline">
        <h2>Historial de Asistencia</h2>
        <div class="controls">
              <label for="filtroAsistencia">Buscar asistencia:</label>
                <input type="text" id="filtroAsistencia" placeholder="Escribe aquí..." onkeyup="filtrarAsistencias()"/>
                <button class="button-mostrar" onclick="toggleAsistencias()">Mostrar/Ocultar</button>
        </div>
        <div class="timeline-content-wrapper">
          <div class="timeline-scroll">
            <div th:each="asistencia : ${cliente.asistencias}" class="timeline-item">
              <div class="timeline-date" th:text="${asistencia.fecha}"></div>
              <div class="timeline-content" th:text="${asistencia.musculos}"></div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
  

  <!-- Footer -->
  <footer class="footer">
    &copy; 2025 GymAssist. Todos los derechos reservados.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>

  <script th:inline="javascript">
  const DateTime = luxon.DateTime;

  /*[[${ultimaFechaAsistencia != null}]]*/ 
  const ultimaFechaAsistenciaStr = /*[['${ultimaFechaAsistencia}']]*/ null;
  const ultimaFecha = ultimaFechaAsistenciaStr ? DateTime.fromISO(ultimaFechaAsistenciaStr) : null;

  document.getElementById("fecha").addEventListener("change", function () {
    const fechaSeleccionada = DateTime.fromISO(this.value);

    let inasistencias = 0;
    if (ultimaFecha && fechaSeleccionada.isValid && ultimaFecha.isValid) {
      const diferencia = fechaSeleccionada.diff(ultimaFecha, "days").days;
      inasistencias = Math.max(0, Math.floor(diferencia) - 1);
    }

    document.getElementById("inasistenciasNuevas").value = inasistencias;
  });
</script>
  
  <script >
    function toggleSidebar() {
    document.body.classList.toggle('sidebar-collapsed');
  }
  function toggleDropdown(e) {
    e.stopPropagation();
    document.getElementById('dropdown').classList.toggle('show');
  }

  document.addEventListener('click', () => {
    document.getElementById('dropdown').classList.remove('show');
  })

  document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') {
      document.body.classList.add('theme-dark');
    }
  });

  function btnTheme() {
    const isDark = document.body.classList.toggle('theme-dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  }
  window.btnTheme = btnTheme;

    function toggleAsistencias() {
    const section = document.querySelector(".card.timeline");
    const timelineScroll = section.querySelector(".timeline-scroll");

    timelineScroll.style.display = timelineScroll.style.display === "none" ? "block" : "none";
  }

  function filtrarAsistencias() {
    const section = document.querySelector(".card.timeline");
    const filtro = section.querySelector("#filtroAsistencia").value.toLowerCase();
    const asistencias = section.querySelectorAll(".timeline-item");

    asistencias.forEach(item => {
      const texto = item.textContent.toLowerCase();
      item.style.display = texto.includes(filtro) ? "block" : "none";
    });
  }
  
   function confirmLogout(event) {
            event.preventDefault();
            
            Swal.fire({
                title: '¿Seguro que quieres cerrar sesión?',
                text: "Tu sesión actual será cerrada",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#2563eb',
                cancelButtonColor: '#ef4444',
                confirmButtonText: '<i class="fas fa-check"></i> Sí, cerrar sesión',
                cancelButtonText: '<i class="fas fa-times"></i> Cancelar',
                backdrop: 'rgba(0,0,0,0.7)',
                customClass: {
                    popup: 'animated-popup',
                    confirmButton: 'btn-confirm-logout',
                    cancelButton: 'btn-cancel-logout'
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({
                        title: 'Cerrando sesión...',
                        html: '<i class="fas fa-spinner fa-spin fa-3x"></i>',
                        showConfirmButton: false,
                        allowOutsideClick: false,
                        timer: 1000
                    });
                    
                    setTimeout(() => {
                        window.location.href = '/Api/Auth/Logout';
                    }, 1000);
                }
            });
        }
        window.confirmLogout = confirmLogout;

        function openModal() {
            document.getElementById('modal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('show');
            document.body.style.overflow = '';
        }
  </script>
</body>
</html>
