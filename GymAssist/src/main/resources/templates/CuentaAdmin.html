<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GymAssist Admin</title>
  <!-- FontAwesome para los iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/Styles/CuentaAdmin.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="icon" href="/Imagenes/icono.png" type="image/png">
</head>

<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="navbar-left">
      <button class="btn-hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
      <div class="navbar-brand">GymAssist Admin</div>
    </div>
    <div class="navbar-right">
      <!-- Selector de tema -->
      <button class="btn-theme" onclick="btnTheme()"><i class="fas fa-moon"></i></button>
      <!-- Perfil -->
      <div class="profile">
        <i class="fas fa-user-circle profile-img" onclick="toggleDropdown(event)"></i>
        <div id="dropdown" class="dropdown">
          <a th:href="@{/Api/Admin/CuentaAdmin}"><i class="fas fa-user-cog"></i> Cuenta</a>
          <a href="#" onclick="confirmLogout(event)" class="danger">
       <i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
    <nav>
      <a th:href="@{/Api/Admin/AdminHome}" title="Dashboard">
        <i class="fas fa-home icon"></i>
        <span class="text">Home</span>
      </a>
      <a th:href="@{/Api/Admin/AdminRegister}" title="Usuarios">
        <i class="fas fa-users icon"></i>
        <span class="text">Clientes</span>
      </a>
      <a th:href="@{/planes/gimnasio/{gymId}(gymId=${gymId})}" title="Membresías">
        <i class="fas fa-credit-card icon"></i>
        <span class="text">Membresías</span>
      </a>
      <a th:href="@{/rutinas/gym/{gymId}(gymId=${gymId})}" title="musculos">
        <i class="fas fa-calendar-alt icon"></i>
        <span class="text">Rutinas</span>
      </a>
      <a th:href="@{/Api/Admin/Dashboard}" title="Reportes">
        <i class="fas fa-chart-pie icon"></i>
        <span class="text">Dashboard</span>
      </a>
      <a th:href="@{/Api/Admin/Predicciones}" title="Predicciones IA">
        <i class="fas fa-brain icon"></i>
        <span class="text">Predicciones IA</span>
      </a>
      <a th:href="@{/modelo}" class="active" title="Modelo">
                <i class="fas fa-calculator icon"></i>
                <span class="text">Modelo</span>
      </a>
    </nav>
  </aside>

  <!-- Main -->
  <main class="main-content">
    <h1>Cuenta</h1>
    <div class="card">
      <form id="updateForm" class="info-update-form fancy-form" action="/Api/Admin/actualizar-admin" method="post">
        <h1 class="form-title">Cambio de Información</h1>
        <div class="form-cam">
          <label for="correo">Correo Electrónico</label>
          <div class="input-icon">
            <i class="fas fa-envelope"></i>
            <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required />
          </div>
        </div>

        <div class="form-cam">
          <label for="password">Contraseña</label>
          <div class="input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" name="password" placeholder="Contraseña" />
          </div>
        </div>

        <div class="form-cam">
          <label for="confirm-password">Confirmar Contraseña</label>
          <div class="input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirmar Contraseña" />
          </div>
        </div>

        <button type="submit" class="btn-update">Actualizar Datos</button>
      </form>
    </div>
  </main>


  <footer class="footer">
    &copy; 2025 GymAssist. Todos los derechos reservados.
  </footer>
  <script>

    function toggleSidebar() {
      document.body.classList.toggle('sidebar-collapsed');
    }
    function toggleDropdown(e) {
      e.stopPropagation();
      document.getElementById('dropdown').classList.toggle('show');
    }

    document.addEventListener('click', () => {
      document.getElementById('dropdown').classList.remove('show');
    })

    // Al cargar la página, aplica el tema guardado:
    document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark') {
        document.body.classList.add('theme-dark');
      }

      // ===== SWEETALERTS PARA MENSAJES =====
      const urlParams = new URLSearchParams(window.location.search);
      const success = urlParams.get('success');
      const error = urlParams.get('error');
      
      if (success === 'true') {
        Swal.fire({
          icon: 'success',
          title: '¡Actualización Exitosa!',
          text: 'Tus datos se han actualizado correctamente',
          showConfirmButton: false,
          timer: 2000,
          timerProgressBar: true,
          backdrop: 'rgba(0,0,0,0.7)'
        }).then(() => {
          window.history.replaceState({}, document.title, window.location.pathname);
        });
      }

      if (error === 'true') {
        Swal.fire({
          icon: 'error',
          title: 'Error al Actualizar',
          text: 'Hubo un problema al actualizar tus datos',
          confirmButtonColor: '#2563eb',
          confirmButtonText: 'Entendido',
          backdrop: 'rgba(0,0,0,0.7)'
        }).then(() => {
          window.history.replaceState({}, document.title, window.location.pathname);
        });
      }
    });

    // Función única para alternar tema y guardarlo
    function btnTheme() {
      const isDark = document.body.classList.toggle('theme-dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    // Exponemos la función al scope global
    window.btnTheme = btnTheme;

    function confirmLogout(event) {
      event.preventDefault();
      
      Swal.fire({
        title: '¿Seguro que quieres cerrar sesión?',
        text: "Tu sesión actual será cerrada",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#2563eb',
        cancelButtonColor: '#ef4444',
        confirmButtonText: '<i class="fas fa-check"></i> Sí, cerrar sesión',
        cancelButtonText: '<i class="fas fa-times"></i> Cancelar',
        backdrop: 'rgba(0,0,0,0.7)',
        customClass: {
          popup: 'animated-popup',
          confirmButton: 'btn-confirm-logout',
          cancelButton: 'btn-cancel-logout'
        }
      }).then((result) => {
        if (result.isConfirmed) {
          // Mostrar loading
          Swal.fire({
            title: 'Cerrando sesión...',
            html: '<i class="fas fa-spinner fa-spin fa-3x"></i>',
            showConfirmButton: false,
            allowOutsideClick: false,
            timer: 1000
          });
          
          // Redirigir después de 1 segundo
          setTimeout(() => {
            window.location.href = '/Api/Auth/Logout';
          }, 1000);
        }
      });
    }
    window.confirmLogout = confirmLogout;

    // ===== VALIDACIÓN DE FORMULARIO =====
    document.getElementById('updateForm')?.addEventListener('submit', (e) => {
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      
      // Solo validar si hay contraseña
      if (password) {
        if (password !== confirmPassword) {
          e.preventDefault();
          Swal.fire({
            icon: 'error',
            title: 'Las contraseñas no coinciden',
            text: 'Verifica que ambas contraseñas sean idénticas',
            confirmButtonColor: '#2563eb',
            confirmButtonText: 'Entendido'
          });
          return false;
        }
        
        if (password.length < 6) {
          e.preventDefault();
          Swal.fire({
            icon: 'warning',
            title: 'Contraseña muy corta',
            text: 'La contraseña debe tener al menos 6 caracteres',
            confirmButtonColor: '#2563eb',
            confirmButtonText: 'Entendido'
          });
          return false;
        }
      }
    });

    function openModal() {
      document.getElementById('modal').classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.remove('show');
      document.body.style.overflow = '';
    }
        
  </script>
</body>
<script src="cuenta.js"></script>

</html>
