<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Calculadora de IMC</title>
    <meta charset="UTF-8">
</head>
<body>
    <h2>Calcula tu IMC</h2>

    <form th:action="@{/Api/Cliente/imc/guardar}" method="post">
        <label for="peso">Peso (kg):</label>
        <input type="number" name="peso" step="0.1" required><br><br>

        <label for="estatura">Estatura (m):</label>
        <input type="number" name="estatura" step="0.01" required><br><br>

        <button type="submit">Calcular</button>
    </form>

    <!-- Mostrar resultado si existe -->
    <div th:if="${imc != null}">
        <h3>Resultado</h3>
        <p>Tu IMC es: <strong th:text="${imc}"></strong></p>
        <p>Interpretación: <strong th:text="${resultado}"></strong></p>
    </div>

    <hr>

    <h3>Historial de mediciones</h3>
    <input type="text" id="filtroFecha" placeholder="Buscar por fecha (YYYY-MM-DD)" onkeyup="filtrarHistorial()" />
    <button type="button" onclick="toggleHistorial()">Mostrar/Ocultar historial</button>

    <ul id="listaHistorial">
        <li th:each="med : ${mediciones}">
            <span th:text="${#temporals.format(med.fechaRegistro, 'yyyy-MM-dd')}">Fecha</span> -
            <span th:text="${med.peso}">Peso</span> kg,
            <span th:text="${med.estatura}">Estatura</span> m
        </li>
    </ul>

    <br>
    <a th:href="@{/Api/Cliente/ClienteHome}">Volver a inicio</a>


    <script>
        function toggleHistorial() {
            const lista = document.getElementById("listaHistorial");
            if (lista.style.display === "none") {
                lista.style.display = "block";
            } else {
                lista.style.display = "none";
            }
        }

        function filtrarHistorial() {
            const filtro = document.getElementById("filtroFecha").value.toLowerCase();
            const items = document.querySelectorAll("#listaHistorial li");

            items.forEach(item => {
                const texto = item.textContent.toLowerCase();
                item.style.display = texto.includes(filtro) ? "list-item" : "none";
            });
        }
    </script>   
</body>
</html>
