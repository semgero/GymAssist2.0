<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Exitoso - GymAssist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .success-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .success-icon {
            font-size: 80px;
            color: #28a745;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .client-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
        }

        .btn-home {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .btn-home:hover {
            background: #218838;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">✅</div>
        <h1>¡Pago Exitoso!</h1>
        <p>Tu suscripción ha sido activada correctamente. Ahora tienes acceso completo al gimnasio.</p>
        
        <div th:if="${cliente}" class="client-info">
            <p><strong>Cliente:</strong> <span th:text="${cliente.nombre}"></span></p>
            <p><strong>Estado:</strong> <span style="color: #28a745; font-weight: bold;">ACTIVO</span></p>
            <p><strong>Inicio membresía:</strong> <span th:text="${cliente.fechaInicioMembresia}"></span></p>
            <p><strong>Fin membresía:</strong> <span th:text="${cliente.fechaFinMembresia}"></span></p>
        </div>
        
        <div th:if="${paymentId}">
            <p style="font-size: 12px; color: #888;">ID de transacción: <span th:text="${paymentId}"></span></p>
        </div>
        
        <p><strong>Gracias por confiar en nosotros.</strong></p>
        
        <!-- ✅ BOTÓN CORREGIDO - Usa el ID del cliente que acaba de pagar -->
        <a th:href="@{/Api/Cliente/ClienteHome}" class="btn-home">Ir al Inicio</a>
        
        <!-- ✅ OPCIÓN ALTERNATIVA: Forzar logout y login -->
        <!-- <a th:href="@{/logout}" class="btn-home">Cerrar Sesión y Volver a Entrar</a> -->
    </div>

    <script>
        // ✅ OPCIONAL: Forzar recarga de sesión después de 2 segundos
        setTimeout(() => {
            console.log('Recargando para actualizar sesión...');
            // window.location.reload();
        }, 2000);
    </script>
</body>
</html>
