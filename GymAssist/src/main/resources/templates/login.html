<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
    <title>GymAssist - Iniciar Sesión</title>
    <link rel="stylesheet" href="/Styles/loginN.css">
</head>
<body>
    <div class="container" id="container">
        <div class="form-container sign-up">
          <form th:action="@{/Api/Auth/register}" method="post">
            <img src="/Imagenes/logo_icon.png" class="logo" alt="Logo del gimnasio">         
              <h1>Register</h1>
              <input type="text" name="username" placeholder="Username" required>
              <input type="email" name="email" placeholder="Email" required>
              <input type="password" name="password" placeholder="Password" required>
              <input type="password" name="confirmPassword" placeholder="Confirm Password" required>                
              <a href="/login" class="forgot-password">Already have an account? Login</a>
               <p th:if="${error}" th:text="${error}" style="color: red;"></p>
              <button type="submit" class="btn">Register</button>
          </form>
        </div>
        <div class="form-container sign-in">
          <form th:action="@{/Api/Auth/login}" method="post">
            <img src="/Imagenes/logo_icon.png" class="logo" alt="Logo del gimnasio">
            <h1>Login</h1>
              <input type="text" name="username" placeholder="username" required>
              <input type="password" name="password" placeholder="Password" required>
              <button type="submit" class="btn">Login</button>
               <a href="/Api/Auth/register" class="forgot-password">Don't have an account? Register</a>
              <p th:if="${error}" th:text="${error}" style="color: red;"></p>
          </form>
        </div>
        <div class="toggle-container">
          <div class="toggle">
            <div class="toggle-panel toggle-left">
              <h1>¡Bienvenido de nuevo!</h1>
              <p>Introduzca sus datos personales para utilizar todas las funciones del sitio</p>
              <button class="hidden" id="login">Iniciar sesion</button>
            </div>
            <div class="toggle-panel toggle-right">
              <h1>Bienvenido a GymAssist!</h1>
              <p>
                ¿Aún no estás registrado? Ingresa aquí y forma parte de nuestro equipo
              </p>
              <button class="hidden" id="register">Registrar</button>
            </div>
          </div>
        </div>
      </div>
  
      <script src="/Styles/loginN.js"></script>
</body>
</html>
