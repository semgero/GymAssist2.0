<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GymAssist Admin</title>
  <!-- FontAwesome para los iconos -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="/Styles/RutinasGrupo.css"/>
  <link rel="icon" href="https://www.iedepragapag.globalconsultor.com/images/logos/globalalog.png" type="image/png">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="navbar-left">
      <button class="btn-hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
      <div class="navbar-brand">GymAssist Admin</div>
    </div>
    <div class="navbar-right">
      <!-- Selector de tema -->
      <button class="btn-theme" onclick="btnTheme()"><i class="fas fa-moon"></i></button>
      <!-- Perfil -->
      <div class="profile">
        <i class="fas fa-user-circle profile-img" onclick="toggleDropdown(event)"></i>
        <div id="dropdown" class="dropdown">
          <a href="cuenta.html"><i class="fas fa-user-cog"></i> Cuenta</a>
          <a href="#" class="danger"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
        <nav>
        <a th:href="@{/Api/Cliente/ClienteHome}" title="home">
            <i class="fas fa-home icon"></i>
            <span class="text">Home</span>
        </a> 
        <a th:href="@{/Api/Cliente/ClienteDashboard}" title="dashboard">
            <i class="fas fa-chart-line icon"></i>
            <span class="text">Dashboard</span>
        </a>
        <a th:href="@{/Api/Cliente/Clienteimc}"title="IMC">
            <i class="fas fa-weight icon"></i>
            <span class="text">IMC</span>
        </a>
        <a th:href="@{/Api/Cliente/ClienteRutinas}" class="active" title="rutinas">
            <i class="fa-solid fa-dumbbell icon"></i>
            <span class="text">Rutinas</span>
        </a>
        <a th:href="@{/Api/Cliente/ClienteAsistencia}" title="Asistencia">
            <i class="fas fa-calendar-check icon"></i>
            <span class="text">Asistencia</span>
        </a>
        </nav>
  </aside>

  <!-- Main -->
<main class="main-content">
    <h1 th:text="'Rutinas de ' + ${grupoMuscular}">Rutinas</h1>
    <div class="card">
        <div class="wrapper">

            <div class="cols">
                <div th:each="rutina : ${rutinas}" class="col" ontouchstart="this.classList.toggle('hover');">
                        <div class="container">

                            <div class="front" th:style="|background-image: url('${#lists.isEmpty(rutina.fotosRutina) ? '/img/default-placeholder.png' : rutina.fotosRutina[0].rutaImagen}');|" >
                                <div class="inner">
                                    <p th:text="${rutina.grupoMuscular}">Grupo Muscular</p>
                                </div>
                            </div>
                            <div class="back">
                                <div class="inner">
                                    <p th:text="'Haz click para ver tu rutina de ' + ${rutina.grupoMuscular}">Ver rutina</p>
                                    <button onclick="abrirModal(this)" th:attr="data-rutina=${rutina.id}">Ver detalles</button>
                                </div>
                            </div>

                            <div class="rutina-imagenes" style="display:none;">
                            <div th:each="imagen : ${rutina.fotosRutina}">
                                <img th:src="${imagen.rutaImagen}" alt="Ejercicio">
                                <p th:text="${imagen.descripcion}">Descripcion del ejercicio</p>
                            </div>
                            </div>
                        </div>
                </div>

                 <div th:if="${#lists.isEmpty(rutinas)}" class="no-rutinas">
                    <img src="/Imagenes/NoDisponible.png" alt="">
                    <p>No hay rutinas disponibles para este grupo muscular.</p>
                    <a th:href="@{/Api/Cliente/ClienteRutinas}" class="btn">Volver a todas las rutinas</a>
                </div>
  </main>

  <!-- MODAL -->
    <div id="modalRutina" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2><i class="fas fa-dumbbell"></i> <span id="tituloModal">Detalles Rutina</span></h2>
        <button class="close" onclick="cerrarModal()">&times;</button>
      </div>
      <div class="modal-body" id="contenidoRutina">
      
      </div>
    </div>
  </div>

    <footer class="footer">
        &copy; 2025 GymAssist. Todos los derechos reservados.
    </footer>

    <script>

    function toggleSidebar() {
    document.body.classList.toggle('sidebar-collapsed');
  }
  function toggleDropdown(e) {
    e.stopPropagation();
    document.getElementById('dropdown').classList.toggle('show');
  }

  document.addEventListener('click', () => {
    document.getElementById('dropdown').classList.remove('show');
  })

  // Al cargar la página, aplica el tema guardado:
  document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') {
      document.body.classList.add('theme-dark');
    }
  });

  // Función única para alternar tema y guardarlo
  function btnTheme() {
    const isDark = document.body.classList.toggle('theme-dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  }

  // Exponemos la función al scope global
  window.btnTheme = btnTheme;

      function abrirModal(btn) {
      const rutina = btn.closest(".col");
      const titulo = rutina.querySelector(".front p").innerText;
      const fotos = rutina.querySelectorAll(".rutina-imagenes div");

      document.getElementById("tituloModal").innerText = titulo;
      document.getElementById("contenidoRutina").innerHTML = "";

      fotos.forEach(foto => {
        const img = foto.querySelector("img");
        const desc = foto.querySelector("p");

        if (img && desc) {
          document.getElementById("contenidoRutina").innerHTML += `
            <div class="foto-item">
              <img src="${img.src}" alt="Ejercicio">
              <p>${desc.innerText}</p>
            </div>
          `;
        }
      });

      document.getElementById("modalRutina").style.display = "block";
    }

    function cerrarModal() {
      document.getElementById("modalRutina").style.display = "none";
    }
    </script>
</body>
</html>
