<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GymAssist Admin</title>
  <!-- FontAwesome para los iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/Styles/AdminRegister.css" />
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="icon" href="https://media.canva.com/v2/image-resize/format:PNG/height:1024/quality:100/uri:ifs%3A%2F%2FM%2F6293492d-90de-4ff2-8521-44571fe13397/watermark:F/width:1024?csig=AAAAAAAAAAAAAAAAAAAAAOLV6xCRNfqeXx4kabpivLv81cm2L12Fl0_78GK7TPjt&exp=1761598823&osig=AAAAAAAAAAAAAAAAAAAAAO_rfXfN2kovLoSwAcy-QVMbV69lhfqYhD4qPePG-u0-&signer=media-rpc&x-canva-quality=screen_2x" type="image/png">
</head>

<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="navbar-left">
      <button class="btn-hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
      <div class="navbar-brand">GymAssist Admin</div>
    </div>
    <div class="navbar-right">
      <!-- Selector de tema -->
      <button class="btn-theme" onclick="btnTheme()"><i class="fas fa-moon"></i></button>
      <!-- Perfil -->
      <div class="profile">
        <i class="fas fa-user-circle profile-img" onclick="toggleDropdown(event)"></i>
        <div id="dropdown" class="dropdown">
          <a th:href="@{/Api/Admin/CuentaAdmin}"><i class="fas fa-user-cog"></i> Cuenta</a>
          <a href="#" onclick="confirmLogout(event)" class="danger">
            <i class="fas fa-sign-out-alt"></i> Cerrar sesión
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
    <nav>
      <a th:href="@{/Api/Admin/AdminHome}" class="active" title="Dashboard">
        <i class="fas fa-home icon"></i>
        <span class="text">Home</span>
      </a>
      <a th:href="@{/Api/Admin/AdminRegister}" title="Usuarios">
        <i class="fas fa-users icon"></i>
        <span class="text">Clientes</span>
      </a>
      <a th:href="@{/planes/gimnasio/{gymId}(gymId=${gymId})}" title="Membresías">
        <i class="fas fa-credit-card icon"></i>
        <span class="text">Membresías</span>
      </a>
      <a th:href="@{/rutinas/gym/{gymId}(gymId=${gymId})}" title="musculos">
        <i class="fas fa-calendar-alt icon"></i>
        <span class="text">Rutinas</span>
      </a>
      <a th:href="@{/Api/Admin/Dashboard}" title="Reportes">
        <i class="fas fa-chart-pie icon"></i>
        <span class="text">Dashboard</span>
      </a>
      <a th:href="@{/Api/Admin/Predicciones}" title="Predicciones IA">
        <i class="fas fa-brain icon"></i>
        <span class="text">Predicciones IA</span>
      </a>
    </nav>
  </aside>

  <!-- Main -->
  <main class="main-content">
    <h1>Home</h1>
    <div class="card">
      <div class="bienvenida-contenido">
        <div class="texto-bienvenida">
          <h1 class="home-title">
            <span class="saludo">Bienvenido,</span> <span th:text="${nombreUsuario}" class="nombre">Admin</span>
          </h1>
          <p class="home-description">Veamos cómo va tu gimnasio hoy 💪</p>
        </div>
        <div class="logo">
          <img class="logo" src="https://monodigital.mx/wp-content/uploads/2019/09/slide01_03.png"
            alt="Ilustración bienvenida">
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    &copy; 2025 GymAssist. Todos los derechos reservados.
  </footer>

  <script>
    function toggleSidebar() {
      document.body.classList.toggle('sidebar-collapsed');
    }

    function toggleDropdown(e) {
      e.stopPropagation();
      document.getElementById('dropdown').classList.toggle('show');
    }

    document.addEventListener('click', () => {
      document.getElementById('dropdown').classList.remove('show');
    });

    // Al cargar la página, aplica el tema guardado
    document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark') {
        document.body.classList.add('theme-dark');
      }
    });

    // Función única para alternar tema y guardarlo
    function btnTheme() {
      const isDark = document.body.classList.toggle('theme-dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    window.btnTheme = btnTheme;

    // ===== FUNCIÓN DE CERRAR SESIÓN CON SWEETALERT (PREMIUM) =====
    function confirmLogout(event) {
      event.preventDefault();
      
      Swal.fire({
        title: '¿Seguro que quieres cerrar sesión?',
        text: "Tu sesión actual será cerrada",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#2563eb',
        cancelButtonColor: '#ef4444',
        confirmButtonText: '<i class="fas fa-check"></i> Sí, cerrar sesión',
        cancelButtonText: '<i class="fas fa-times"></i> Cancelar',
        backdrop: 'rgba(0,0,0,0.7)',
        reverseButtons: false,
        focusCancel: false,
        customClass: {
          popup: 'animated-popup',
          confirmButton: 'btn-confirm-logout',
          cancelButton: 'btn-cancel-logout'
        },
        buttonsStyling: false // ⚠️ CRUCIAL: Usar estilos personalizados
      }).then((result) => {
        if (result.isConfirmed) {
          // Mostrar loading mientras cierra sesión
          Swal.fire({
            title: 'Cerrando sesión...',
            html: '<i class="fas fa-spinner fa-spin fa-3x"></i>',
            showConfirmButton: false,
            allowOutsideClick: false,
            allowEscapeKey: false,
            timer: 1500,
            didOpen: () => {
              Swal.showLoading();
            }
          });
          
          // Redirigir después de 1.5 segundos
          setTimeout(() => {
            window.location.href = '/Api/Auth/Logout';
          }, 1500);
        }
      });
    }

    window.confirmLogout = confirmLogout;

    function confirmLogout(event) {
            event.preventDefault();
            
            Swal.fire({
                title: '¿Seguro que quieres cerrar sesión?',
                text: "Tu sesión actual será cerrada",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#2563eb',
                cancelButtonColor: '#ef4444',
                confirmButtonText: '<i class="fas fa-check"></i> Sí, cerrar sesión',
                cancelButtonText: '<i class="fas fa-times"></i> Cancelar',
                backdrop: 'rgba(0,0,0,0.7)',
                customClass: {
                    popup: 'animated-popup',
                    confirmButton: 'btn-confirm-logout',
                    cancelButton: 'btn-cancel-logout'
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    // Mostrar loading
                    Swal.fire({
                        title: 'Cerrando sesión...',
                        html: '<i class="fas fa-spinner fa-spin fa-3x"></i>',
                        showConfirmButton: false,
                        allowOutsideClick: false,
                        timer: 1000
                    });
                    
                    // Redirigir después de 1 segundo
                    setTimeout(() => {
                        window.location.href = '/Api/Auth/Logout';
                    }, 1000);
                }
            });
        }
        window.confirmLogout = confirmLogout;

        function openModal() {
            document.getElementById('modal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('show');
            document.body.style.overflow = '';
        }
        
  </script>
</body>

</html>
