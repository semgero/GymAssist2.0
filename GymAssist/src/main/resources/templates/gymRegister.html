<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Gimnasio</title>
    <link rel="stylesheet" href="/Styles/estilos.css">
</head>
<body>
    <h2>Registro de Gimnasio</h2>
    <form th:action="@{/gimnasios/register}" method="post" enctype="multipart/form-data">
        <div>
            <label for="rut">RUT:</label>
            <input type="number" id="rut" name="rut" th:value="*{rut}" required>
        </div>
        <div>
            <label for="nombreGymnasio">Nombre del Gimnasio:</label>
            <input type="text" id="nombreGymnasio" name="nombreGymnasio" th:value="*{nombreGymnasio}" required>
        </div>
        <div>
            <label for="descripcion">Descripción:</label>
            <textarea id="descripcion" name="descripcion" th:text="*{descripcion}" required></textarea>
        </div>
        <div>
            <label for="direccion">Dirección:</label>
            <input type="text" id="direccion" name="direccion" th:value="*{direccion}" required>
        </div>
        <div>
            <label for="fotos">Foto:</label>
            <input type="file" name="fotos">
        </div>
        <div>
            <button type="submit">Registrar Gimnasio</button>
        </div>
    </form>
    <!-- Mensaje de éxito/error opcional -->
    <div th:if="${success}" style="color:green;">¡Gimnasio registrado correctamente!</div>
    <div th:if="${error}" style="color:red;">Error al registrar el gimnasio.</div>
</body>
</html>
