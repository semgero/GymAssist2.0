<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GymAssist Admin - Rutinas</title>
    <!-- FontAwesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Styles/rutinasGimnasio.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="icon" href="https://media.canva.com/v2/image-resize/format:PNG/height:1024/quality:100/uri:ifs%3A%2F%2FM%2F6293492d-90de-4ff2-8521-44571fe13397/watermark:F/width:1024?csig=AAAAAAAAAAAAAAAAAAAAAOLV6xCRNfqeXx4kabpivLv81cm2L12Fl0_78GK7TPjt&exp=1761598823&osig=AAAAAAAAAAAAAAAAAAAAAO_rfXfN2kovLoSwAcy-QVMbV69lhfqYhD4qPePG-u0-&signer=media-rpc&x-canva-quality=screen_2x" type="image/png">
</head>

<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="navbar-left">
            <button class="btn-hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div class="navbar-brand">GymAssist Admin</div>
        </div>
        <div class="navbar-right">
            <!-- Selector de tema -->
            <button class="btn-theme" onclick="btnTheme()"><i class="fas fa-moon"></i></button>
            <!-- Perfil -->
            <div class="profile">
                <i class="fas fa-user-circle profile-img" onclick="toggleDropdown(event)"></i>
                <div id="dropdown" class="dropdown">
                    <a href="/Api/Admin/CuentaAdmin"><i class="fas fa-user-cog"></i> Cuenta</a>
                    <a href="#" onclick="confirmLogout(event)" class="danger">
                        <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar">
        <nav>
            <a th:href="@{/Api/Admin/AdminHome}"  title="Dashboard">
                <i class="fas fa-home icon"></i>
                <span class="text">Home</span>
            </a>
            <a th:href="@{/Api/Admin/AdminRegister}" title="Usuarios">
                <i class="fas fa-users icon"></i>
                <span class="text">Clientes</span>
            </a>
            <a th:href="@{/planes/gimnasio/{gymId}(gymId=${gymId})}" title="Membresías">
                <i class="fas fa-credit-card icon"></i>
                <span class="text">Membresías</span>
            </a>
            <a th:href="@{/rutinas/gym/{gymId}(gymId=${gymId})}" class="active" title="musculos">
                <i class="fas fa-calendar-alt icon"></i>
                <span class="text">Rutinas</span>
            </a>
            <a th:href="@{/Api/Admin/Dashboard/{gymId}}" title="Reportes">
                <i class="fas fa-chart-pie icon"></i>
                <span class="text">Dashboard</span>
            </a>
            <a th:href="@{/Api/Admin/Predicciones}" title="Predicciones IA">
                <i class="fas fa-brain icon"></i>
                <span class="text">Predicciones IA</span>
            </a>
        </nav>
    </aside>

    <!-- Main -->
    <main class="main-content">
        <div class="container">
            <!-- Formulario -->
            <div class="card add-rutina-form">
                <h2><i class="fas fa-dumbbell"></i> Nueva Rutina</h2>
                <form th:action="@{/rutinas/gym/{gymId}/guardar(gymId=${gymId})}" method="post"
                    enctype="multipart/form-data">
                    <div class="input-group"><i class="fas fa-tag"></i><input type="text" name="nombreEjercicio"
                            placeholder="Nombre del ejercicio" required /></div>
                    <div class="input-group"><i class="fas fa-users"></i><input type="text" name="grupoMuscular"
                            placeholder="Grupo Muscular" required /></div>
                    <div class="input-group"><i class="fas fa-repeat"></i><input type="text" name="repeticiones"
                            placeholder="Repeticiones" required /></div>
                    <div class="input-group"><i class="fas fa-layer-group"></i><input type="text" name="series"
                            placeholder="Series" required /></div>
                    <div id="fotos-section">
                        <h3><i class="fas fa-images"></i> Fotos de la Rutina</h3>
                        <div id="fotos-container">
                            <div class="foto-item">
                                <div class="file-group">
                                    <label class="file-btn">
                                        <i class="fas fa-upload"></i>Seleccionar Archivo
                                        <input type="file" name="fotosRutina" class="file-input" required
                                            onchange="mostrarNombreArchivo(this)" />
                                    </label>
                                    <div class="file-name"></div>
                                </div>
                                <div class="input-group"><i class="fas fa-align-left"></i><input type="text"
                                        name="descripciones" placeholder="Descripción breve" required /></div>
                            </div>
                        </div>
                        <div class="actions">
                            <button type="button" class="btn" onclick="agregarFoto()"><i class="fas fa-plus"></i>
                                Agregar Foto</button>
                        </div>
                    </div>
                    <div class="actions">
                        <button type="submit" class="btn"><i class="fas fa-save"></i> Guardar</button>
                    </div>
                </form>
            </div>
            <!-- Tabla de Rutinas -->
            <div class="card rutina-list">
                <h2><i class="fas fa-list"></i> Rutinas Existentes</h2>
                <div class="ruta-table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Ejercicio</th>
                                <th>Grupo</th>
                                <th>Reps</th>
                                <th>Series</th>
                                <th>Fotos</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="rutina : ${rutinas}">
                                <td th:text="${rutina.nombreEjercicio}"></td>
                                <td th:text="${rutina.grupoMuscular}"></td>
                                <td th:text="${rutina.repeticiones}"></td>
                                <td th:text="${rutina.series}"></td>
                                <td>
                                    <div class="photo-carousel">
                                        <div th:each="foto : ${rutina.fotosRutina}" class="photo-slide">
                                            <img th:src="${foto.rutaImagen}" alt="Ejercicio" />
                                            <span th:text="${foto.descripcion}"></span>
                                        </div>
                                        <div class="carousel-nav"></div>
                                    </div>
                                </td>
                                <td class="acciones">
                                    <a th:href="@{'/rutinas/' + ${rutina.id} + '/editar'}"><i class="fas fa-edit"></i>
                                        Editar</a>
                                    <form th:action="@{'/rutinas/' + ${rutina.id} + '/eliminar'}" method="post"
                                        style="display:inline;">
                                        <input type="hidden" th:name="gymId" th:value="${gymId}" />
                                        <button type="submit"
                                            onclick="return confirm('¿Seguro que deseas eliminar?')"><i
                                                class="fas fa-trash-alt"></i> Eliminar</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        &copy; 2025 GymAssist. Todos los derechos reservados.
    </footer>
    <script>
        function toggleSidebar() {
            document.body.classList.toggle('sidebar-collapsed');
        }
        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById('dropdown').classList.toggle('show');
        }

        document.addEventListener('click', () => {
            document.getElementById('dropdown').classList.remove('show');
        })

        // Al cargar la página, aplica el tema guardado:
        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark') {
                document.body.classList.add('theme-dark');
            }
        });

        // Función única para alternar tema y guardarlo
        function btnTheme() {
            const isDark = document.body.classList.toggle('theme-dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Exponemos la función al scope global
        window.btnTheme = btnTheme;

        document.addEventListener('DOMContentLoaded', initPhotoCarousels);
        function agregarFoto() {
            const cont = document.getElementById('fotos-container');
            const nuevo = document.createElement('div');
            nuevo.classList.add('foto-item');
            nuevo.innerHTML = `
                <div class="file-group" style="display: flex; align-items: center; gap: 12px;">
            <label class="file-btn" style="margin: 0;">
                <i class="fas fa-upload"></i> <span>Seleccionar Archivo</span>
                <input type="file" name="fotosRutina" class="file-input" required />
            </label>
            <div class="file-name" style="font-size: 0.9rem; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;"></div>
            </div>
            <div class="input-group">
            <i class="fas fa-align-left"></i>
            <input type="text" name="descripciones" placeholder="Descripción breve" required />
            </div>
        `;
            cont.appendChild(nuevo);

            const input = nuevo.querySelector('input[type="file"]');
            input.addEventListener('change', function () {
                mostrarNombreArchivo(this);
            });
        }


        function initPhotoCarousels() {
            document.querySelectorAll('.photo-carousel').forEach(carousel => {
                const slides = carousel.querySelectorAll('.photo-slide');
                const nav = carousel.querySelector('.carousel-nav');
                slides.forEach(sl => sl.classList.remove('active'));
                slides[0]?.classList.add('active');
                nav.innerHTML = '';
                slides.forEach((_, i) => {
                    const btn = document.createElement('button');
                    btn.textContent = i + 1;
                    btn.onclick = () => showSlide(carousel, i);
                    nav.appendChild(btn);
                });
                nav.firstChild?.classList.add('active');
            });
        }
        function showSlide(carousel, i) {
            const slides = carousel.querySelectorAll('.photo-slide');
            const btns = carousel.querySelectorAll('.carousel-nav button');
            slides.forEach(s => s.classList.remove('active'));
            btns.forEach(b => b.classList.remove('active'));
            slides[i]?.classList.add('active');
            btns[i]?.classList.add('active');
        }
        function mostrarNombreArchivo(input) {
            const fileName = input.files[0]?.name || '';
            const fileGroup = input.closest('.file-group');
            const nameDisplay = fileGroup.querySelector('.file-name');
            nameDisplay.textContent = fileName;
        }

        function confirmLogout(event) {
            event.preventDefault();
            
            Swal.fire({
                title: '¿Seguro que quieres cerrar sesión?',
                text: "Tu sesión actual será cerrada",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#2563eb',
                cancelButtonColor: '#ef4444',
                confirmButtonText: '<i class="fas fa-check"></i> Sí, cerrar sesión',
                cancelButtonText: '<i class="fas fa-times"></i> Cancelar',
                backdrop: 'rgba(0,0,0,0.7)',
                customClass: {
                    popup: 'animated-popup',
                    confirmButton: 'btn-confirm-logout',
                    cancelButton: 'btn-cancel-logout'
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    // Mostrar loading
                    Swal.fire({
                        title: 'Cerrando sesión...',
                        html: '<i class="fas fa-spinner fa-spin fa-3x"></i>',
                        showConfirmButton: false,
                        allowOutsideClick: false,
                        timer: 1000
                    });
                    
                    // Redirigir después de 1 segundo
                    setTimeout(() => {
                        window.location.href = '/Api/Auth/Logout';
                    }, 1000);
                }
            });
        }
        window.confirmLogout = confirmLogout;

        function openModal() {
            document.getElementById('modal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('show');
            document.body.style.overflow = '';
        }
        
        
    </script>
</body>

</html>
