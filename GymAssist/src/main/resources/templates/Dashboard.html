<!DOCTYPE html>
<html lang="es">

<head>
    <!-- PASAR A LA PARTE DE ADMINHOME -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GymAssist Admin</title>
    <!-- FontAwesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="/Styles/AdminRegister.css" />
    <link rel="icon" href="https://www.iedepragapag.globalconsultor.com/images/logos/globalalog.png" type="image/png">
</head>

<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="navbar-left">
            <button class="btn-hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div class="navbar-brand">GymAssist Admin</div>
        </div>
        <div class="navbar-right">
            <!-- Selector de tema -->
            <button class="btn-theme" onclick="btnTheme()"><i class="fas fa-moon"></i></button>
            <!-- Perfil -->
            <div class="profile">
                <i class="fas fa-user-circle profile-img" onclick="toggleDropdown(event)"></i>
                <div id="dropdown" class="dropdown">
                    <a th:href="@{/Api/Admin/CuentaAdmin}"><i class="fas fa-user-cog"></i> Cuenta</a>
                    <a th:href="@{/Api/Auth/Logout}"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar">
        <nav>
            <a th:href="@{/Api/Admin/AdminHome}" class="active" title="Dashboard">
                <i class="fas fa-home icon"></i>
                <span class="text">Home</span>
            </a>
            <a th:href="@{/Api/Admin/AdminRegister}" title="Usuarios">
                <i class="fas fa-users icon"></i>
                <span class="text">Clientes</span>
            </a>
            <a th:href="@{/planes/gimnasio/{gymId}(gymId=${gymId})}" title="Membresías">
                <i class="fas fa-credit-card icon"></i>
                <span class="text">Membresías</span>
            </a>
            <a th:href="@{/rutinas/gym/{gymId}(gymId=${gymId})}" title="musculos">
                <i class="fas fa-calendar-alt icon"></i>
                <span class="text">Rutinas</span>
            </a>
            <a href="#" title="Reportes">
                <i class="fas fa-chart-pie icon"></i>
                <span class="text">Dashboard</span>
            </a>
        </nav>
    </aside>

    <h1>Informe Power BI: GymAssist</h1>

    <!-- Aquí va tu iframe -->
    <div style="display: flex; justify-content: center; align-items: center; height: 90vh;">
        <iframe title="GymAssist Power BI Report" width="1000" height="600"
            src="https://app.powerbi.com/view?r=eyJrIjoiMTlmZDYzNTUtMjUyOC00NjVlLWFhN2ItNzJkZTJlNWFkYmJmIiwidCI6IjlkMTJiZjNmLWU0ZjYtNDdhYi05MTJmLTFhMmYwZmM0OGFhNCIsImMiOjR9" frameborder="0" allowfullscreen="true"
            style="border: 2px solid #ccc; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.2);">
        </iframe>
    </div>

</body>
