<!DOCTYPE html>
<html lang="es">

<head>
    <!-- PASAR A LA PARTE DE ADMINHOME -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GymAssist Admin</title>
    <!-- FontAwesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="/Styles/DashboardAdmin.css" />
    <link rel="icon" href="https://www.iedepragapag.globalconsultor.com/images/logos/globalalog.png" type="image/png">
</head>

<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="navbar-left">
            <button class="btn-hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div class="navbar-brand">GymAssist Admin</div>
        </div>
        <div class="navbar-right">
            <!-- Selector de tema -->
            <button class="btn-theme" onclick="btnTheme()"><i class="fas fa-moon"></i></button>
            <!-- Perfil -->
            <div class="profile">
                <i class="fas fa-user-circle profile-img" onclick="toggleDropdown(event)"></i>
                <div id="dropdown" class="dropdown">
                    <a th:href="@{/Api/Admin/CuentaAdmin}"><i class="fas fa-user-cog"></i> Cuenta</a>
                    <a th:href="@{/Api/Auth/Logout}" class="danger">
                        <i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar">
        <nav>
            <a th:href="@{/Api/Admin/AdminHome}" title="Dashboard">
                <i class="fas fa-home icon"></i>
                <span class="text">Home</span>
            </a>
            <a th:href="@{/Api/Admin/AdminRegister}" title="Usuarios">
                <i class="fas fa-users icon"></i>
                <span class="text">Clientes</span>
            </a>
            <a th:href="@{/planes/gimnasio/{gymId}(gymId=${gymId})}" title="Membresías">
                <i class="fas fa-credit-card icon"></i>
                <span class="text">Membresías</span>
            </a>
            <a th:href="@{/rutinas/gym/{gymId}(gymId=${gymId})}" title="musculos">
                <i class="fas fa-calendar-alt icon"></i>
                <span class="text">Rutinas</span>
            </a>
            <a href="#" class="active" title="Reportes">
                <i class="fas fa-chart-pie icon"></i>
                <span class="text">Dashboard</span>
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <h1>Dashboard</h1>
        <div class="card">
            <div class="iframe-container">
                <iframe title="GymAssist Power BI Report"
                    src="https://app.powerbi.com/view?r=eyJrIjoiMTlmZDYzNTUtMjUyOC00NjVlLWFhN2ItNzJkZTJlNWFkYmJmIiwidCI6IjlkMTJiZjNmLWU0ZjYtNDdhYi05MTJmLTFhMmYwZmM0OGFhNCIsImMiOjR9"
                    allowfullscreen="true">
                </iframe>
            </div>
        </div>
    </main>


    <footer class="footer">
        &copy; 2025 GymAssist. Todos los derechos reservados.
    </footer>

    <script>
        function toggleSidebar() {
            document.body.classList.toggle('sidebar-collapsed');
        }
        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById('dropdown').classList.toggle('show');
        }
        document.addEventListener('click', () => {
            document.getElementById('dropdown').classList.remove('show');
        })

        // Al cargar la página, aplica el tema guardado:
        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark') {
                document.body.classList.add('theme-dark');
            }
        });

        // Función única para alternar tema y guardarlo
        function btnTheme() {
            const isDark = document.body.classList.toggle('theme-dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Exponemos la función al scope global
        window.btnTheme = btnTheme;
    </script>
</body>
