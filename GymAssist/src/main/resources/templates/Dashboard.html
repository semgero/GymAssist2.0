<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - GymAssist</title>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
        rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="/Styles/dashboarddd.css" />
    <link rel="icon" href="/Imagenes/icono.png" type="image/png">
</head>

<body>
    <!-- Navbar -->
    <header class="navbar">
        <div class="navbar-left">
            <button class="btn-hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div class="navbar-brand">GymAssist Admin</div>
        </div>
        <div class="navbar-right">
            <button class="btn-theme" onclick="btnTheme()"><i class="fas fa-moon"></i></button>
            <div class="profile">
                <i class="fas fa-user-circle profile-img" onclick="toggleDropdown(event)"></i>
                <div id="dropdown" class="dropdown">
                    <a th:href="@{/Api/Admin/CuentaAdmin}"><i class="fas fa-user-cog"></i> Cuenta</a>
                    <a href="#" onclick="confirmLogout(event)" class="danger">
                        <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar">
        <nav>
            <a th:href="@{/Api/Admin/AdminHome}" title="Dashboard">
                <i class="fas fa-home icon"></i>
                <span class="text">Home</span>
            </a>
            <a th:href="@{/Api/Admin/AdminRegister}" title="Usuarios">
                <i class="fas fa-users icon"></i>
                <span class="text">Clientes</span>
            </a>
            <a th:href="@{/planes/gimnasio/{gymId}(gymId=${gymId})}" title="Membresías">
                <i class="fas fa-credit-card icon"></i>
                <span class="text">Membresías</span>
            </a>
            <a th:href="@{/rutinas/gym/{gymId}(gymId=${gymId})}" title="Rutinas">
                <i class="fas fa-calendar-alt icon"></i>
                <span class="text">Rutinas</span>
            </a>
            <a th:href="@{/Api/Admin/Dashboard}" title="Dashboard" class="active">
                <i class="fas fa-chart-pie icon"></i>
                <span class="text">Dashboard</span>
            </a>
            <a th:href="@{/Api/Admin/Predicciones}" title="Predicciones IA">
                <i class="fas fa-brain icon"></i>
                <span class="text">Predicciones IA</span>
            </a>
             <a th:href="@{/modelo}"title="Modelo">
        <i class="fas fa-calculator icon"></i>
        <span class="text">Modelo</span>
      </a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="header-section">
            <h1><i class="fas fa-chart-line"></i> Dashboard - <span th:text="${nombreGym}">Mi Gimnasio</span></h1>
        </div>

        <!-- Power BI Dashboard -->
        <div class="powerbi-container" style="width: 100%; display: flex; justify-content: center; padding: 20px 0;">
            <iframe title="GymAssistBI" width="100%" height="800"
                th:src="${'https://app.powerbi.com/reportEmbed?reportId=3c12af2b-7a75-40a8-bb30-323965fb1ff4&autoAuth=true&ctid=9d12bf3f-e4f6-47ab-912f-1a2f0fc48aa4&filter=dim_gimnasio%2Fid_gimnasio%20eq%20%27' + gymId + '%27'}"
                frameborder="0" allowFullScreen="true"
                style="border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
            </iframe>
        </div>
    </main>

    <footer class="footer">
        &copy; 2025 GymAssist. Todos los derechos reservados.
    </footer>

    <script>
        // Cargar datos iniciales
        document.addEventListener('DOMContentLoaded', function () {
            // Cargar tema guardado
            const saved = localStorage.getItem('theme');
            if (saved === 'dark') {
                document.body.classList.add('theme-dark');
                document.querySelector('.btn-theme i').className = 'fas fa-sun';
            }
        });

        // Funciones del navbar/sidebar
        function toggleSidebar() {
            document.body.classList.toggle('sidebar-collapsed');
        }

        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById('dropdown').classList.toggle('show');
        }

        document.addEventListener('click', () => {
            document.getElementById('dropdown').classList.remove('show');
        });

        function btnTheme() {
            const isDark = document.body.classList.toggle('theme-dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            const icon = document.querySelector('.btn-theme i');
            icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
        }

        function confirmLogout(event) {
            event.preventDefault();

            Swal.fire({
                title: '¿Seguro que quieres cerrar sesión?',
                text: "Tu sesión actual será cerrada",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#2563eb',
                cancelButtonColor: '#ef4444',
                confirmButtonText: '<i class="fas fa-check"></i> Sí, cerrar sesión',
                cancelButtonText: '<i class="fas fa-times"></i> Cancelar',
                backdrop: 'rgba(0,0,0,0.7)',
                customClass: {
                    popup: 'animated-popup',
                    confirmButton: 'btn-confirm-logout',
                    cancelButton: 'btn-cancel-logout'
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    // Mostrar loading
                    Swal.fire({
                        title: 'Cerrando sesión...',
                        html: '<i class="fas fa-spinner fa-spin fa-3x"></i>',
                        showConfirmButton: false,
                        allowOutsideClick: false,
                        timer: 1000
                    });

                    // Redirigir después de 1 segundo
                    setTimeout(() => {
                        window.location.href = '/Api/Auth/Logout';
                    }, 1000);
                }
            });
        }
        window.confirmLogout = confirmLogout;

        function openModal() {
            document.getElementById('modal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('show');
            document.body.style.overflow = '';
        }

    </script>
</body>

</html>
