<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GymAssist Cliente</title>
  <!-- FontAwesome para los iconos -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="/Styles/ClienteHome.css"/>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="icon" href="https://media.canva.com/v2/image-resize/format:PNG/height:1024/quality:100/uri:ifs%3A%2F%2FM%2F6293492d-90de-4ff2-8521-44571fe13397/watermark:F/width:1024?csig=AAAAAAAAAAAAAAAAAAAAAOLV6xCRNfqeXx4kabpivLv81cm2L12Fl0_78GK7TPjt&exp=1761598823&osig=AAAAAAAAAAAAAAAAAAAAAO_rfXfN2kovLoSwAcy-QVMbV69lhfqYhD4qPePG-u0-&signer=media-rpc&x-canva-quality=screen_2x" type="image/png">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="navbar-left">
      <button class="btn-hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
      <div class="navbar-brand">GymAssist Cliente</div>
    </div>
    <div class="navbar-right">
      <!-- Selector de tema -->
      <button class="btn-theme" onclick="btnTheme()"><i class="fas fa-moon"></i></button>
      <!-- Perfil -->
      <div class="profile">
        <i class="fas fa-user-circle profile-img" onclick="toggleDropdown(event)"></i>
        <div id="dropdown" class="dropdown">
          <a th:href="@{ClienteCuenta}"><i class="fas fa-user-cog"></i> Cuenta</a>
          <a href="#" onclick="confirmLogout(event)" class="danger">
            <i class="fas fa-sign-out-alt"></i> Cerrar sesión
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
    <nav>
      <a th:href="@{/Api/Cliente/ClienteHome}" class="active" title="home">
        <i class="fas fa-home icon"></i>
        <span class="text">Home</span>
      </a>
      <a th:href="@{/Api/Cliente/Clienteimc}" title="IMC">
        <i class="fas fa-weight icon"></i>
        <span class="text">IMC</span>
      </a>
      <a th:href="@{/Api/Cliente/ClienteRutinas}" title="rutinas">
        <i class="fa-solid fa-dumbbell icon"></i>
        <span class="text">Rutinas</span>
      </a>
      <a th:href="@{/Api/Cliente/ClienteAsistencia}" title="Asistencia">
        <i class="fas fa-calendar-check icon"></i>
        <span class="text">Asistencia</span>
      </a>
    </nav>
  </aside>

  <!-- Main -->
  <main class="main-content">
    <h1>Inicio</h1>
    <div class="card">
        <div class="bienvenida-contenido">
          <div class="texto-bienvenida">
            <h1 class="home-title">
              <span class="saludo">Bienvenido,</span> <span class="nombre" th:text="${cliente.nombre}">👋</span>
            </h1>
            <p class="home-description">Veamos como va tu progreso 💪</p>
          </div>
          <div class="dumbbell-container">
            <!-- Mancuerna desde Icons8 -->
            <img src="https://img.icons8.com/ios-filled/150/2c3e50/dumbbell.png" alt="Mancuerna" />
            <div class="shadow"></div>
        </div>
        </div>
      </div>                      
  </main>

  <!-- Footer -->
  <footer class="footer">
    &copy; 2025 GymAssist. Todos los derechos reservados.
  </footer>

  <script>
    function toggleSidebar() {
      document.body.classList.toggle('sidebar-collapsed');
    }

    function toggleDropdown(e) {
      e.stopPropagation();
      document.getElementById('dropdown').classList.toggle('show');
    }

    document.addEventListener('click', () => {
      document.getElementById('dropdown').classList.remove('show');
    });

    // Al cargar la página, aplica el tema guardado
    document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark') {
        document.body.classList.add('theme-dark');
      }

      // ===== SWEETALERT PARA LOGIN EXITOSO =====
      const urlParams = new URLSearchParams(window.location.search);
      const success = urlParams.get('success');
      
      if (success === 'true') {
        Swal.fire({
          icon: 'success',
          title: '¡Bienvenido!',
          text: 'Has iniciado sesión exitosamente',
          showConfirmButton: false,
          timer: 2000,
          timerProgressBar: true,
          customClass: {
            popup: 'animated-popup'
          },
          backdrop: 'rgba(0,0,0,0.7)',
          didOpen: () => {
            Swal.showLoading();
          }
        }).then(() => {
          // Limpiar URL después de mostrar el alert
          window.history.replaceState({}, document.title, window.location.pathname);
        });
      }
    });

    // Función única para alternar tema y guardarlo
    function btnTheme() {
      const isDark = document.body.classList.toggle('theme-dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    // Exponemos la función al scope global
    window.btnTheme = btnTheme;

    function confirmLogout(event) {
      event.preventDefault();
      
      Swal.fire({
        title: '¿Seguro que quieres cerrar sesión?',
        text: "Tu sesión actual será cerrada",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#2563eb',
        cancelButtonColor: '#ef4444',
        confirmButtonText: '<i class="fas fa-check"></i> Sí, cerrar sesión',
        cancelButtonText: '<i class="fas fa-times"></i> Cancelar',
        backdrop: 'rgba(0,0,0,0.7)',
        customClass: {
          popup: 'animated-popup',
          confirmButton: 'btn-confirm-logout',
          cancelButton: 'btn-cancel-logout'
        }
      }).then((result) => {
        if (result.isConfirmed) {
          // Mostrar loading
          Swal.fire({
            title: 'Cerrando sesión...',
            html: '<i class="fas fa-spinner fa-spin fa-3x"></i>',
            showConfirmButton: false,
            allowOutsideClick: false,
            timer: 1000
          });
          
          // Redirigir después de 1 segundo
          setTimeout(() => {
            window.location.href = '/Api/Auth/Logout';
          }, 1000);
        }
      });
    }

    window.confirmLogout = confirmLogout;

    function openModal() {
      document.getElementById('modal').classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.remove('show');
      document.body.style.overflow = '';
    }
  </script>
</body>
</html>
