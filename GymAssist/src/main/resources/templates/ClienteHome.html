<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GymAssist Cliente</title>
  <!-- FontAwesome para los iconos -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="/Styles/ClienteHome.css"/>
  <link rel="icon" href="https://www.iedepragapag.globalconsultor.com/images/logos/globalalog.png" type="image/png">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="navbar-left">
      <button class="btn-hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
      <div class="navbar-brand">GymAssist Cliente</div>
    </div>
    <div class="navbar-right">
      <!-- Selector de tema -->
      <button class="btn-theme" onclick="btnTheme()"><i class="fas fa-moon"></i></button>
      <!-- Perfil -->
      <div class="profile">
        <i class="fas fa-user-circle profile-img" onclick="toggleDropdown(event)"></i>
        <div id="dropdown" class="dropdown">
          <a th:href="@{ClienteCuenta}"><i class="fas fa-user-cog"></i> Cuenta</a>
          <a th:href="@{/Api/Auth/Logout}" class="danger"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
    <nav>
      <a th:href="@{/Api/Cliente/ClienteHome}" class="active" title="home">
        <i class="fas fa-home icon"></i>
        <span class="text">Home</span>
      </a> 
      <a th:href="@{/Api/Cliente/ClienteDashboard}" title="dashboard">
        <i class="fas fa-chart-line icon"></i>
        <span class="text">Dashboard</span>
      </a>
      <a th:href="@{/Api/Cliente/Clienteimc}" title="IMC">
        <i class="fas fa-weight icon"></i>
        <span class="text">IMC</span>
      </a>
      <a th:href="@{/Api/Cliente/ClienteRutinas}" title="rutinas">
        <i class="fa-solid fa-dumbbell icon"></i>
        <span class="text">Rutinas</span>
      </a>
      <a th:href="@{/Api/Cliente/ClienteAsistencia}" title="Asistencia">
        <i class="fas fa-calendar-check icon"></i>
        <span class="text">Asistencia</span>
      </a>
    </nav>
  </aside>

  <!-- Main -->
  <main class="main-content">
    <h1>Home</h1>
    <div class="card">
        <div class="bienvenida-contenido">
          <div class="texto-bienvenida">
            <h1 class="home-title">
              <span class="saludo">Bienvenido,</span> <span class="nombre" th:text="${cliente.nombre}">👋</span>
            </h1>
            <p class="home-description">Veamos como va tu progreso 💪</p>
          </div>
          <div class="dumbbell-container">
            <!-- Mancuerna desde Icons8 -->
            <img src="https://img.icons8.com/ios-filled/150/2c3e50/dumbbell.png" alt="Mancuerna" />
            <div class="shadow"></div>
        </div>
        </div>
      </div>                      
  </main>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    &copy; 2025 GymAssist. Todos los derechos reservados.
  </footer>

  <script>
    function toggleSidebar() {
    document.body.classList.toggle('sidebar-collapsed');
  }
  function toggleDropdown(e) {
    e.stopPropagation();
    document.getElementById('dropdown').classList.toggle('show');
  }

  document.addEventListener('click', () => {
    document.getElementById('dropdown').classList.remove('show');
  })

  // Al cargar la página, aplica el tema guardado:
  document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') {
      document.body.classList.add('theme-dark');
    }
  });

  // Función única para alternar tema y guardarlo
  function btnTheme() {
    const isDark = document.body.classList.toggle('theme-dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  }

  // Exponemos la función al scope global
  window.btnTheme = btnTheme;
  </script>
</body>
</html>
