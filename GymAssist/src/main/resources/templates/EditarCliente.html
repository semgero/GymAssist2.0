<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/Imagenes/logo_icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cliente - Gym Management</title>
    <link rel="stylesheet" href="/Styles/server.css">
    <link rel="stylesheet" href="/Styles/editarcliente.css">
</head>
<body>
    
    <div class="hamburger" id="hamburger">&#9776;</div>

    <div class="sidebar" id="sidebar">
        <h2>Gym Management</h2>
        <ul>
            <li><a href="/dashboard">🏠 Dashboard</a></li>
            <li><a href="/clientes">👥 Clientes</a></li>
            <li><a href="/pagos">💵 Pagos</a></li>
            <li><a href="/configuracion">⚙️ Configuración</a></li>
        </ul>
    </div>

    <div class="main-content">
        <header>
            <h1>Editar Cliente</h1>
        </header>
        
        <div class="edit-client-form">
            <form >
                <h2>Actualizar Información</h2>
                
                <!-- Campo para el nombre -->
                <input type="text" th:name="nombre" th:value="${cliente.nombre}" placeholder="Nombre Completo" id="clientName" required>
            
                <!-- Campo para el correo electrónico -->
                <input type="email" th:name="correo" th:value="${cliente.correo}" placeholder="Correo Electrónico" id="clientEmail" required>
            
                <!-- Campo para el número de teléfono -->
                <input type="tel" th:name="telefono" th:value="${cliente.telefono}" placeholder="Número de Teléfono" id="clientPhone" required>
            
                <!-- Campo para seleccionar la mensualidad -->
                <select th:name="mensualidad" required>
                    <option value="Plan Mensual" th:selected="${cliente.mensualidad == 'Plan Mensual'}">Plan Mensual</option>
                </select>
            
                <!-- Campo para el username -->
                <input type="text" th:name="username" th:value="${cliente.username}" placeholder="Nombre de Usuario" id="clientUsername" required>
            
                <!-- Campo para el password (puedes dejarlo vacío si no deseas modificar la contraseña) -->
                <input type="password" th:name="password"  placeholder="Contraseña" id="clientPassword">
            
                <div class="form-actions">
                    <button type="submit" class="action-btn">Guardar Cambios</button>
                    <a href="/Api/Admin/AdminHome" class="delete-btn">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
    <script>
        const hamburger = document.getElementById('hamburger');
        const sidebar = document.getElementById('sidebar');

        hamburger.addEventListener('click', (event) => {
            event.stopPropagation();
            sidebar.classList.toggle('active');
        });

        document.body.addEventListener('click', (event) => {
            if (!sidebar.contains(event.target) && !hamburger.contains(event.target) && sidebar.classList.contains('active')) {
                sidebar.classList.remove('active');
            }
        });

        sidebar.addEventListener('click', (event) => {
            event.stopPropagation();
        });
    </script>
</body>
</html>
