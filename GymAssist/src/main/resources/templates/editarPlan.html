<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editar Plan</title>
    <link rel="stylesheet" href="/Styles/AdminHome.css">
</head>
<body>
    <div class="main-content">
        <header>
            <h1>Editar Plan</h1>
        </header>
        <div class="edit-plan-form">
            <form th:action="@{/planes/{id}/actualizar(id=${plan.id})}" method="post">
                <input type="hidden" name="gymId" th:value="${plan.gymId}" />
                <input type="text" name="nombre" th:value="${plan.nombre}" placeholder="Nombre del Plan" required>
                <input type="text" name="descripcion" th:value="${plan.descripcion}" placeholder="Descripción" required>
                <input type="number" name="precio" th:value="${plan.precio}" placeholder="Precio" min="0" required>
                <input type="number" name="duracion" th:value="${plan.duracion}" placeholder="Duración (meses)" min="1" required>
                <button type="submit">Guardar Cambios</button>
                <a th:href="@{/planes/gimnasio/{gymId}(gymId=${plan.gymId})}" class="action-btn">Cancelar</a>
            </form>
        </div>
    </div>
</body>
</html>
