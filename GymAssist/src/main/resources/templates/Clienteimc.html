<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GymAssist Cliente</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="/Styles/imc.css"/>
  <link rel="icon" href="https://media.canva.com/v2/image-resize/format:PNG/height:1024/quality:100/uri:ifs%3A%2F%2FM%2F6293492d-90de-4ff2-8521-44571fe13397/watermark:F/width:1024?csig=AAAAAAAAAAAAAAAAAAAAAOLV6xCRNfqeXx4kabpivLv81cm2L12Fl0_78GK7TPjt&exp=1761598823&osig=AAAAAAAAAAAAAAAAAAAAAO_rfXfN2kovLoSwAcy-QVMbV69lhfqYhD4qPePG-u0-&signer=media-rpc&x-canva-quality=screen_2x" type="image/png">
</head>
<body>
  <header class="navbar">
    <div class="navbar-left">
      <button class="btn-hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
      <div class="navbar-brand">GymAssist Cliente</div>
    </div>
    <div class="navbar-right">
      <button class="btn-theme" onclick="btnTheme()"><i class="fas fa-moon"></i></button>
      <div class="profile">
        <i class="fas fa-user-circle profile-img" onclick="toggleDropdown(event)"></i>
        <div id="dropdown" class="dropdown">
          <a th:href="@{ClienteCuenta}"><i class="fas fa-user-cog"></i> Cuenta</a>
          <a th:href="@{/Api/Auth/Logout}" class="danger"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a>
        </div>
      </div>
    </div>
  </header>

  <aside class="sidebar">
    <nav>
      <a th:href="@{/Api/Cliente/ClienteHome}" title="home">
        <i class="fas fa-home icon"></i>
        <span class="text">Home</span>
      </a>
      <a th:href="@{/Api/Cliente/Clienteimc}" class="active" title="IMC">
        <i class="fas fa-weight icon"></i>
        <span class="text">IMC</span>
      </a>
      <a th:href="@{/Api/Cliente/ClienteRutinas}" title="rutinas">
        <i class="fa-solid fa-dumbbell icon"></i>
        <span class="text">Rutinas</span>
      </a>
      <a th:href="@{/Api/Cliente/ClienteAsistencia}" title="Asistencia">
        <i class="fas fa-calendar-check icon"></i>
        <span class="text">Asistencia</span>
      </a>
    </nav>
  </aside>

  <main class="main-content">
    <h1>Índice de Masa Corporal</h1>
    <div class="card">
      <section class="imc-section">
        <h2>Calcula tu IMC</h2>
        <form th:action="@{/Api/Cliente/imc/guardar}" method="post" class="imc-form">
          <div class="form-group">
            <label for="peso">Peso (kg):</label>
            <input type="number" name="peso" step="0.1" required>
          </div>
          <div class="form-group">
            <label for="estatura">Estatura (m):</label>
            <input type="number" name="estatura" step="0.01" required>
          </div>
          <button type="submit" class="btn-submit">Calcular</button>
        </form>

        <div th:if="${imc != null}" class="resultado">
          <h3>Resultado</h3>
          <p>Tu Ultimo regitro de IMC es de: <strong th:text="${imc}"></strong></p>
          <p>Interpretación: <strong th:text="${resultado}"></strong></p>
        </div>

        <hr class="divider"/>

        <h3>Historial de mediciones</h3>
        <input type="text" id="filtroFecha" placeholder="Buscar por fecha (YYYY-MM-DD)" onkeyup="filtrarHistorial()" class="input-busqueda"/>
        <button type="button" onclick="toggleHistorial()" class="btn-toggle">Mostrar/Ocultar historial</button>

        <ul id="listaHistorial" class="historial-lista">
          <li th:each="med : ${mediciones}">
            <span th:text="${#temporals.format(med.fechaRegistro, 'yyyy-MM-dd')}">Fecha</span> -
            <span th:text="${med.peso}">Peso</span> kg,
            <span th:text="${med.estatura}">Estatura</span> m
          </li>
          
        </ul>

        <br/>
        <a th:href="@{/Api/Cliente/ClienteHome}" class="btn-volver"><i class="fas fa-arrow-left"></i> Volver a inicio</a>
      </section>
    </div>
  </main>

  <footer class="footer">
    &copy; 2025 GymAssist. Todos los derechos reservados.
  </footer>

  <script>
    function toggleSidebar() {
    document.body.classList.toggle('sidebar-collapsed');
  }
  function toggleDropdown(e) {
    e.stopPropagation();
    document.getElementById('dropdown').classList.toggle('show');
  }

  document.addEventListener('click', () => {
    document.getElementById('dropdown').classList.remove('show');
  })

  // Al cargar la página, aplica el tema guardado:
  document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') {
      document.body.classList.add('theme-dark');
    }
  });

  // Función única para alternar tema y guardarlo
  function btnTheme() {
    const isDark = document.body.classList.toggle('theme-dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  }

  // Exponemos la función al scope global
  window.btnTheme = btnTheme;

  function toggleHistorial() {
            const lista = document.getElementById("listaHistorial");
            if (lista.style.display === "none") {
                lista.style.display = "block";
            } else {
                lista.style.display = "none";
            }
        }

        function filtrarHistorial() {
            const filtro = document.getElementById("filtroFecha").value.toLowerCase();
            const items = document.querySelectorAll("#listaHistorial li");

            items.forEach(item => {
                const texto = item.textContent.toLowerCase();
                item.style.display = texto.includes(filtro) ? "list-item" : "none";
            });
        }
  </script>
</body>
</html>
