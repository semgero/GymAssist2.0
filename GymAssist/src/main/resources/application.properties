# =====================================================================
# Todas las claves salen de variables de entorno (ver .env.example).
# En local: copia .env.example a .env (en esta carpeta GymAssist/) y llénalo.
# En Railway: pégalas en Variables > Raw Editor.
# Las variables del sistema / Railway tienen prioridad sobre el archivo .env.
# =====================================================================
spring.config.import=optional:file:.env[.properties],optional:file:GymAssist/.env[.properties]
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info
spring.application.name=GymAssist
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:TU_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:TU_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.data.mongodb.uri=${MONGODB_URL}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# PostgreSQL (Railway) - formato jdbc:postgresql://HOST:PUERTO/BASE
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

spring.data.redis.url=${SPRING_DATA_REDIS_URL:redis://localhost:6379}

spring.session.store-type=redis
spring.session.timeout=1800
server.tomcat.threads.max=50
server.tomcat.accept-count=100
server.tomcat.max-connections=500

# MercadoPago Configuration - Usar variables de entorno
mercadopago.access.token=${MP_ACCESS_TOKEN:}
mercadopago.public.key=${MP_PUBLIC_KEY:}
app.payment.success.url=https://${RAILWAY_PUBLIC_DOMAIN:localhost:8080}/Api/Payment/success
app.payment.failure.url=https://${RAILWAY_PUBLIC_DOMAIN:localhost:8080}/Api/Payment/failure
app.payment.pending.url=https://${RAILWAY_PUBLIC_DOMAIN:localhost:8080}/Api/Payment/pending

# Groq API Configuration
groq.api.key=${GROQ_API_KEY}
groq.model=openai/gpt-oss-120b
groq.api.url=https://api.groq.com/openai/v1/chat/completions

# API de prediccion en Python (FastAPI + TensorFlow)
ml.api.url=${ML_API_URL:http://localhost:8000}
# Encender la API de Python automaticamente al arrancar Spring Boot (poner false en Railway)
ml.api.autostart=${ML_API_AUTOSTART:true}
