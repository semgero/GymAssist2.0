management.endpoint.health.enabled=true

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Session
spring.session.store-type=redis
spring.session.timeout=1800

# MercadoPago
mercadopago.access.token=${MP_ACCESS_TOKEN:}
mercadopago.public.key=${MP_PUBLIC_KEY:}

# URLs - IMPORTANTE: usa el dominio de Railway
app.payment.success.url=https://${RAILWAY_STATIC_URL:localhost:8080}/Api/Payment/success
app.payment.failure.url=https://${RAILWAY_STATIC_URL:localhost:8080}/Api/Payment/failure  
app.payment.pending.url=https://${RAILWAY_STATIC_URL:localhost:8080}/Api/Payment/pending