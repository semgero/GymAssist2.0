management.endpoints.web.exposure.include=health,info
spring.application.name=GymAssist

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=TU_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=TU_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# MongoDB - soportar ambas variables
spring.data.mongodb.uri=${MONGO_URL:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/gymassist}}

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Redis - soportar ambos formatos
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Spring Session
spring.session.store-type=redis
spring.session.timeout=1800

# MercadoPago Configuration
mercadopago.access.token=${MP_ACCESS_TOKEN:}
mercadopago.public.key=${MP_PUBLIC_KEY:}
app.payment.success.url=https://${RAILWAY_PUBLIC_DOMAIN:localhost:8080}/Api/Payment/success
app.payment.failure.url=https://${RAILWAY_PUBLIC_DOMAIN:localhost:8080}/Api/Payment/failure
app.payment.pending.url=https://${RAILWAY_PUBLIC_DOMAIN:localhost:8080}/Api/Payment/pending